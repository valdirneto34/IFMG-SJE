<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula de Funções e Eventos</title>
    <style>
        @charset "UTF-8";

        :root {
            --cor-background: #eaeaff;
            --cor-background-div: #fff;
            --cor-borda-div: black;
            --cor-sombra: #0000001a;
        }

        * {
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--cor-background);
        }

        .dancarina {
            position: relative;
            margin: auto;
            width: 200px;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 0px 4px 15px var(--cor-sombra);
            background-color: var(--cor-background-div);
        }

        .img-passaro {
            width: 200px;
        }
    </style>
</head>

<body>
    <div class="dancarina">
        <img class="img-passaro" src="passaro.webp" alt="Foto de um pássaro">
    </div>
</body>
