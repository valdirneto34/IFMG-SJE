<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Aula de Bootstrap</title>
    <link rel="shortcut icon" href="assets/bootstrap-logo.svg" type="image/x-icon">
</head>

<body class="bg-info">
    <nav class="navbar bg-body-tertiary">
        <form class="container-fluid justify-content-start">
            <img class="me-2" src="assets/bootstrap-logo.svg" alt="Bootstrap" width="30" height="24">
            <button class="btn btn-outline-success me-2" type="button">Home</button>
            <button class="btn btn-sm btn-outline-secondary me-2" type="button">Products</button>
            <button class="btn btn-sm btn-outline-secondary me-2" type="button">Feedbacks</button>
            <button class="btn btn-sm btn-outline-secondary me-2" type="button">Contact</button>
            <button class="btn btn-sm btn-outline-secondary" type="button">About Us</button>
        </form>
    </nav>

    <h1 class="bg-primary text-white text-center text-uppercase border border-white rounded-3">Qualquer coisa nele aí...
    </h1>
    <div class="row">
        <div class="col-3 bg-danger text-center border border-black rounded-3">Col 1</div>
        <div class="col-3 bg-success text-center border border-black rounded-3">Col 2</div>
        <div class="col-6 bg-white text-center border border-black rounded-3">Col 3</div>
    </div>

    <div class="container-md bg-white border border-black mt-2">100% wide until screen size less than 768px</div>
    <div class="container-lg bg-white border border-black mt-2">100% wide until screen size less than 992px</div>
    <div class="container-xl bg-white border border-black mt-2">100% wide until screen size less than 1200px</div>
    <div class="container-sm bg-white border border-black mt-2">100% wide until screen size less than 576px</div>
</body>

</html>
