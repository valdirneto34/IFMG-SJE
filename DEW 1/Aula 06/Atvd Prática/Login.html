<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>

<body>
    <h1>Login</h1>
    <form autocomplete="on">
        <img class="logoIfmg" src="https://ead.ifmg.edu.br/saojoaoevangelista/pluginfile.php/1/theme_academi/logo/1774270357/campus-sao-joao-evangelista.png" alt="Logo IFMG-SJE">
        <div class="linha-form">
            <label for="user">Usuário:</label>
            <input type="text" name="user" id="user" placeholder="Digite seu usuário">
        </div>

        <div class="linha-form">
            <label for="password">Senha:</label>
            <input type="password" name="password" id="password" placeholder="Digite sua senha">
        </div>

        <div class="controles">
            <button type="submit" class="botaoSubmit">Entrar</button>
        </div>

        <p class="texto-auxiliar">Não tem conta? <a href="Cadastro.html">Cadastre-se</a></p>
    </form>
    <p class="autoria"><a target="_blank" href="https://github.com/valdirneto34">&copy; Valdir Neto</a></p>
</body>

</html>
