<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Saldo e Créditos</title>
</head>

<body>
    <h1>Saldo e Créditos</h1>
    <form autocomplete="on">
        <div class="linha-form">
            <label for="">Usuário: </label>
            <span>Valdir de Souza</span>
        </div>

        <div class="linha-form" id="creditos">
            <label>Créditos disponíveis:</label>
            <span>R$45,00</span>
        </div>

        <div class="linha-form">
            <h3>Comprar Créditos:</h3>
        </div>

        <div class="linha-form">
            <label for="quantidade">Quantidade (R$):</label>
            <input type="number" name="quantidade" id="quantidade" placeholder="Ex: 20,00">
        </div>

        <div class="controles">
            <button type="submit" class="botaoSubmit">Comprar</button>
        </div>
        <p class="texto-auxiliar">💡Débito automático conforme refeição e perfil do usuário</p>
    </form>
    <p class="autoria"><a target="_blank" href="https://github.com/valdirneto34">&copy; Valdir Neto</a></p>
</body>

</html>
