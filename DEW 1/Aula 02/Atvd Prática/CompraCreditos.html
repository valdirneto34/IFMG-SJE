<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saldo e Créditos</title>
</head>

<body>
    <h1>Saldo e Créditos</h1>
    <table>
        <tr>
            <td colspan="2"><strong>Usuário: </strong> Valdir de Souza</td>
            <td><strong>Perfil: </strong> Aluno</td>
        </tr>
        <tr>
            <td colspan="2">Créditos disponíveis:</td>
            <td>R$ 45,00</td>
        </tr>
        <tr>
            <td><strong>Comprar Créditos:</strong></td>
        </tr>
        <tr>
            <td><label for="quantidade"><strong>Quantidade (R$):</strong></label></td>
            <td><input type="number" name="quantidade" id="quantidade" placeholder="Ex: 20,00"></td>
            <td><input type="submit" value="Comprar"></td>
        </tr>
        <tr>
            <td colspan="2"><em>Débito automático conforme refeição e perfil do usuário</em></td>
        </tr>
    </table>
</body>

</html>
